name: Discovery Scan (15-Minute Target)

# ==============================================================================
# PHASE 0 NOTE (SC-010):
# The 15-minute cron schedule (`7,22,37,52 * * * *`) is designed and documented
# below, but intentionally commented out until Phase 3 when:
# 1. Provider compliance/feasibility is finalized,
# 2. Neon PostgreSQL write credentials and schema security are verified, and
# 3. Explicit repository owner authorization is granted.
# ==============================================================================
on:
  # schedule:
  #   - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (DEMO or LIVE)"
        required: false
        default: "DEMO"
        type: choice
        options:
          - DEMO
          - LIVE

permissions:
  contents: read

concurrency:
  group: priceradar-discovery-worker
  cancel-in-progress: false

jobs:
  discover:
    name: Execute Bounded Catalog Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Safety gate: only allow manual dispatch until scheduled runs are authorized in Phase 3
    if: github.event_name == 'workflow_dispatch'
    steps:
      # actions/checkout v4.2.2
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # pnpm/action-setup v4.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.24.0

      # actions/setup-node v4.2.0
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run standalone discovery worker
        env:
          PRICERADAR_DATA_MODE: ${{ inputs.mode || 'DEMO' }}
        run: pnpm worker:scan
